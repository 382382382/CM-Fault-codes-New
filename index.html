<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fault Codes">
<title>Fault Code Lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column, sticky tab bar, inputs on top, result cards below */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --ink:#14232b; --muted:#5b6b73; --line:#d5dde1;
  --accent:#0b6b73; --accent-ink:#ffffff; --accent-soft:#d9eef0;
  --warn:#9a5b00; --warn-soft:#fdeccf; --crit:#a3262a; --crit-soft:#fbdedf;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-code:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a1f; --surface:#17262d; --ink:#e6eef1; --muted:#93a6ae; --line:#2a3d46;
    --accent:#4fc3cc; --accent-ink:#06242a; --accent-soft:#143840;
    --warn:#f0b35a; --warn-soft:#3a2a10; --crit:#f08a8d; --crit-soft:#3b1a1c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a1f; --surface:#17262d; --ink:#e6eef1; --muted:#93a6ae; --line:#2a3d46;
  --accent:#4fc3cc; --accent-ink:#06242a; --accent-soft:#143840;
  --warn:#f0b35a; --warn-soft:#3a2a10; --crit:#f08a8d; --crit-soft:#3b1a1c; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
header{padding:20px 0 12px}
h1{margin:0;font-size:1.25rem;font-weight:600;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:.85rem}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-bottom:1px solid var(--line)}
nav button{font:inherit;font-size:.9rem;font-weight:500;padding:11px 6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;cursor:pointer;min-height:44px}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{display:none;padding-top:16px}
.panel.on{display:block}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.inputs .full{grid-column:1/-1}
label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
input,select{width:100%;font:inherit;font-size:1.1rem;font-family:var(--font-code);padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:48px}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.status{font-size:.85rem;color:var(--muted);margin:4px 0 12px;min-height:1.3em}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.fc{font-family:var(--font-code);font-weight:600;font-size:.95rem;word-break:break-word;margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pill{font-family:var(--font-code);font-size:.78rem;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.pill b{font-weight:600;color:var(--muted);margin-right:4px}
.flag{background:var(--crit-soft);color:var(--crit);font-weight:600}
.flag.soft{background:var(--warn-soft);color:var(--warn)}
.none{color:var(--muted);font-size:.85rem}
.row{margin-top:8px}
.row .k{display:block;font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.row .v{font-size:.95rem;word-break:break-word}
.card.dtc{border-left-color:var(--warn)}
.more{width:100%;font:inherit;font-weight:500;padding:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;min-height:48px;cursor:pointer}
.hint{font-size:.8rem;color:var(--muted);margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fault Code Lookup</h1>
    <p class="sub">PPE and HSE fault tables, VM DTC list. Data from Fault_codes_12_11_26.xlsx.</p>
  </header>
  <nav role="tablist" aria-label="Lookup type">
    <button role="tab" id="t-id" aria-selected="true" aria-controls="p-id" data-tab="by-id">ID + Hardware</button>
    <button role="tab" id="t-dtc" aria-selected="false" aria-controls="p-dtc" data-tab="by-dtc">DTC / SPN</button>
    <button role="tab" id="t-spn" aria-selected="false" aria-controls="p-spn" data-tab="by-spn">SPN / FMI</button>
  </nav>

  <section class="panel on" id="p-id" role="tabpanel" aria-labelledby="t-id">
    <div class="inputs">
      <div><label for="in-id">ID</label><input id="in-id" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="2"></div>
      <div><label for="in-hw">Hardware</label>
        <select id="in-hw">
          <option>PPE</option><option>HSE</option><option>DDS</option><option>PTT</option><option>GEARBOX</option>
          <option>ECU</option><option>WHEEL</option><option>JOYSTICK</option><option>PEU</option><option>LEVER</option>
        </select></div>
    </div>
    <div class="status" id="st-id" aria-live="polite"></div>
    <div id="out-id"></div>
    <p class="hint">Hardware accepts PPE or HSE (the table) or a unit such as DDS, GEARBOX or WHEEL.</p>
  </section>

  <section class="panel" id="p-dtc" role="tabpanel" aria-labelledby="t-dtc">
    <div class="inputs">
      <div class="full"><label for="in-dtc">DTC or SPN</label><input id="in-dtc" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" value="157"></div>
    </div>
    <div class="status" id="st-dtc" aria-live="polite"></div>
    <div id="out-dtc"></div>
    <p class="hint">Partial codes work: P0087 or 157 returns every variant.</p>
  </section>

  <section class="panel" id="p-spn" role="tabpanel" aria-labelledby="t-spn">
    <div class="inputs">
      <div><label for="in-spn">SPN</label><input id="in-spn" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="516403"></div>
      <div><label for="in-fmi">FMI</label><input id="in-fmi" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value=""></div>
    </div>
    <div class="status" id="st-spn" aria-live="polite"></div>
    <div id="out-spn"></div>
    <p class="hint">Fill in either box or both. Clear a box to ignore it.</p>
  </section>
</div>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label = n => n.replace(/_/g,' ');

function row(k, v){ return v ? '<div class="row"><span class="k">'+k+'</span><span class="v">'+esc(v)+'</span></div>' : ''; }
function faultCard(f, mode){
  const flags = f.on.length
    ? f.on.map(n => '<span class="pill flag">'+esc(label(n))+'</span>').join('')
    : '<span class="none">No action flags set</span>';
  const meta = mode==='id'
    ? '<span class="pill"><b>SPN</b>'+f.spn+'</span><span class="pill"><b>FMI</b>'+f.fmi+'</span>'
    : '<span class="pill"><b>ID</b>'+f.id+'</span><span class="pill"><b>HW</b>'+esc(f.hw)+'</span>';
  return '<article class="card"><p class="fc">'+esc(f.fc)+'</p><div class="meta">'+meta+'</div>'
    + '<div class="row"><span class="k">Action</span><span class="v meta" style="margin:0">'+flags+'</span></div>'
    + row('Info', f.i1) + row('Info 2', f.i2) + row('Info 3', f.i3) + '</article>';
}

/* 1. ID + Hardware */
function runId(){
  const raw = $('in-id').value.trim(), hw = $('in-hw').value.trim().toLowerCase();
  const out = $('out-id'), st = $('st-id');
  if(raw===''){ out.innerHTML=''; st.textContent='Enter an ID.'; return; }
  const id = Number(raw);
  const f = Number.isInteger(id) ? DATA.faults.find(x => x.id===id && (x.t.toLowerCase()===hw || x.hw.toLowerCase()===hw)) : null;
  if(!f){ out.innerHTML=''; st.textContent='No match for ID '+raw+' and '+$('in-hw').value+'.'; return; }
  st.textContent='Found in '+f.t+' table (unit: '+f.hw+').';
  out.innerHTML = faultCard(f,'id');
}

/* 2. DTC or SPN (VM) */
function runDtc(){
  const q = $('in-dtc').value.trim().toLowerCase();
  const out = $('out-dtc'), st = $('st-dtc');
  if(q===''){ out.innerHTML=''; st.textContent='Enter a DTC or an SPN.'; return; }
  const hit = (s) => { s = s.toLowerCase(); return s===q || s.startsWith(q+'-'); };
  const rows = DATA.vm.filter(r => hit(r.dtc) || hit(r.spn));
  st.textContent = rows.length ? rows.length+' match'+(rows.length>1?'es':'') : 'No matches.';
  out.innerHTML = rows.map(r => '<article class="card dtc"><p class="fc">'+esc(r.dtc)+'</p><div class="meta"><span class="pill"><b>SPN</b>'+esc(r.spn)+'</span></div><div class="row"><span class="k">Description</span><span class="v">'+esc(r.d)+'</span></div></article>').join('');
}

/* 3. SPN and/or FMI */
let shown = 50, lastKey = '';
function runSpn(){
  const a = $('in-spn').value.trim(), b = $('in-fmi').value.trim();
  const out = $('out-spn'), st = $('st-spn');
  if(a==='' && b===''){ out.innerHTML=''; st.textContent='Enter an SPN, an FMI, or both.'; return; }
  const key = a+'|'+b; if(key!==lastKey){ shown = 50; lastKey = key; }
  const rows = DATA.faults.filter(f => (a==='' || String(f.spn)===a) && (b==='' || String(f.fmi)===b));
  st.textContent = rows.length ? rows.length+' match'+(rows.length>1?'es':'') + (rows.length>shown ? ', showing '+shown : '') : 'No matches.';
  out.innerHTML = rows.slice(0,shown).map(f => faultCard(f,'spn')).join('')
    + (rows.length>shown ? '<button class="more" id="more">Show '+Math.min(50,rows.length-shown)+' more</button>' : '');
  const m = $('more'); if(m) m.onclick = () => { shown += 50; runSpn(); };
}

['in-id','in-hw'].forEach(i => $(i).addEventListener('input', runId));
$('in-dtc').addEventListener('input', runDtc);
['in-spn','in-fmi'].forEach(i => $(i).addEventListener('input', runSpn));

/* tabs, remembered in the URL hash */
const TABS = {'by-id':'id','by-dtc':'dtc','by-spn':'spn'};
function show(h){
  const key = TABS[h] ? h : 'by-id';
  Object.keys(TABS).forEach(k => {
    const on = k===key, n = TABS[k];
    $('p-'+n).classList.toggle('on', on);
    $('t-'+n).setAttribute('aria-selected', on);
  });
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.tab; show(b.dataset.tab); }));
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));
runId(); runDtc(); runSpn();
</script>
</body>
